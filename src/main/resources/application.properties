spring.application.name=attendance-system

# ===== 0. 服务端口 =====
server.port=8081

# Trust X-Forwarded-* headers from ngrok/reverse proxies so redirects keep https://
server.forward-headers-strategy=framework

# Reduce transfer time over public tunnels/mobile networks
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Let browsers cache versioned static assets instead of re-downloading them on every page
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ===== 1. 数据源配置 =====
# 指定数据库连接URL，其中 'attendance_system' 是你的数据库名
spring.datasource.url=jdbc:postgresql://localhost:5432/attendance_system
# 数据库用户名
spring.datasource.username=postgres
# 数据库密码，请替换为你自己的密码
spring.datasource.password=wj42411061
# PostgreSQL驱动类名
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== 2. JPA 配置 =====
# 设置数据库方言为 PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 控制台打印SQL语句，便于调试
spring.jpa.show-sql=true
# 设置DDL策略为 update，Hibernate会根据实体自动更新表结构
spring.jpa.hibernate.ddl-auto=update
# 设置SQL语句的格式化输出
spring.jpa.properties.hibernate.format_sql=true

# ===== 3. Session Configuration =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== 4. App Configuration =====
# 公网/局域网访问地址，用于生成二维码
# - 设为 auto 或留空：自动检测当前局域网IP（推荐，适应DHCP动态IP）
app.public-url=auto
