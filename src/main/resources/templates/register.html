<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生考勤系统 - 注册</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="glass-card">
    <h2>创建账号</h2>
    <p class="subtitle">加入学生考勤管理系统</p>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" autocomplete="off">
            <span class="form-error" id="usernameError"></span>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="至少6位密码">
            <span class="form-error" id="passwordError"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="请再次输入密码">
            <span class="form-error" id="confirmError"></span>
        </div>
        <div class="form-group">
            <label for="name">真实姓名</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="请输入真实姓名">
            <span class="form-error" id="nameError"></span>
        </div>
        <div class="form-group">
            <label for="role">角色</label>
            <select id="role" name="role" class="form-control">
                <option value="student">学生</option>
                <option value="teacher">教师</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">注册</button>
        <div class="auth-footer">
            已有账号？<a href="/login">立即登录</a>
        </div>
        <div id="globalError" class="global-error"></div>
    </form>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
