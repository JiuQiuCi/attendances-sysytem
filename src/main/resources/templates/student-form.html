<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-required-role="teacher">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息表单 - 西南财经大学考勤系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/auth-check.js"></script>

<div class="form-container">
    <div class="dash-header" style="margin-bottom:20px;">
        <div class="dash-brand">
            <img class="emblem-logo" src="/images/logo.png" alt="西南财经大学" style="width:44px;height:44px;">
            <span class="dash-school" th:text="${student != null ? '编辑学生' : '新增学生'}">新增学生</span>
        </div>
        <a href="/index" style="color:var(--text-secondary);font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 14px;border-radius:var(--radius-full);transition:all var(--transition);">返回首页 →</a>
    </div>

    <form id="studentForm">
        <input type="hidden" id="id" name="id" th:value="${student?.id}">

        <div class="form-group">
            <label>学号 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="studentId" name="studentId" class="form-control" th:value="${student?.studentId}">
            <span class="form-error" id="studentIdError"></span>
        </div>

        <div class="form-group">
            <label>姓名 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="name" name="name" class="form-control" th:value="${student?.name}">
            <span class="form-error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label>班级</label>
            <input type="text" id="className" name="className" class="form-control" th:value="${student?.className}">
        </div>

        <div class="form-group">
            <label>学院</label>
            <input type="text" id="college" name="college" class="form-control" th:value="${student?.college}" placeholder="例如: 计算机与人工智能学院">
        </div>

        <div class="form-group">
            <label>年级</label>
            <input type="text" id="grade" name="grade" class="form-control" th:value="${student?.grade}" placeholder="例如: 2024">
        </div>

        <div class="form-group">
            <label>专业</label>
            <input type="text" id="major" name="major" class="form-control" th:value="${student?.major}" placeholder="例如: 计算机科学与技术">
        </div>

        <div class="form-group">
            <label>性别</label>
            <select id="gender" name="gender" class="form-control">
                <option value="">请选择</option>
                <option value="男" th:selected="${student?.gender == '男'}">男</option>
                <option value="女" th:selected="${student?.gender == '女'}">女</option>
            </select>
        </div>

        <div class="form-group">
            <label>出生日期</label>
            <input type="date" id="birthDate" name="birthDate" class="form-control" th:value="${student?.birthDate}">
        </div>

        <div class="form-group">
            <label>联系电话</label>
            <input type="text" id="phone" name="phone" class="form-control" th:value="${student?.phone}" placeholder="请输入手机号码">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary btn-lg">保存</button>
            <button type="button" class="btn btn-secondary btn-lg" onclick="window.location.href='/student/list-page'">返回列表</button>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('studentForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');

        const id = document.getElementById('id').value;
        const studentId = document.getElementById('studentId').value.trim();
        const name = document.getElementById('name').value.trim();
        const className = document.getElementById('className').value.trim();
        const college = document.getElementById('college').value.trim();
        const grade = document.getElementById('grade').value.trim();
        const major = document.getElementById('major').value.trim();
        const gender = document.getElementById('gender').value;

        let hasError = false;
        const showErr = (id, msg) => {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            hasError = true;
        };
        if (!studentId) showErr('studentIdError', '学号不能为空');
        if (!name) showErr('nameError', '姓名不能为空');
        if (hasError) return;

        const birthDate = document.getElementById('birthDate').value;
        const phone = document.getElementById('phone').value.trim();

        const student = { studentId, name, className, college: college || null, grade: grade || null, major: major || null, gender, birthDate: birthDate || null, phone: phone || null };
        if (id) student.id = parseInt(id);

        const url = id ? '/student/update' : '/student/add';
        const method = id ? 'PUT' : 'POST';

        try {
            const resp = await authFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            const result = await resp.json();
            if (result.code === 200) {
                alert(id ? '更新成功' : '添加成功');
                window.location.href = '/student/list-page';
            } else { alert(result.message); }
        } catch (err) { alert('网络错误，请稍后重试'); }
    });
</script>
</body>
</html>
