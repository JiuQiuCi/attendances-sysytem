<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-required-role="teacher">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息表单 - 西南财经大学考勤系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/auth-check.js"></script>
<div class="form-container">
    <div class="form-header">
        <img class="emblem-logo" src="/images/logo.png" alt="西南财经大学">
        <span th:text="${student != null ? '编辑学生' : '新增学生'}">学生信息</span>
    </div>

    <form id="studentForm">
        <input type="hidden" id="id" name="id" th:value="${student?.id}">

        <div class="form-group">
            <label>学号 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="studentId" name="studentId" class="form-control" th:value="${student?.studentId}">
            <span class="form-error" id="studentIdError"></span>
        </div>

        <div class="form-group">
            <label>姓名 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="name" name="name" class="form-control" th:value="${student?.name}">
            <span class="form-error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label>班级</label>
            <input type="text" id="className" name="className" class="form-control" th:value="${student?.className}">
        </div>

        <div class="form-group">
            <label>性别</label>
            <select id="gender" name="gender" class="form-control">
                <option value="">请选择</option>
                <option value="男" th:selected="${student?.gender == '男'}">男</option>
                <option value="女" th:selected="${student?.gender == '女'}">女</option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary btn-lg">保存</button>
            <button type="button" class="btn btn-secondary btn-lg" onclick="window.location.href='/student/list-page'">返回列表</button>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('studentForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');

        const id = document.getElementById('id').value;
        const studentId = document.getElementById('studentId').value.trim();
        const name = document.getElementById('name').value.trim();
        const className = document.getElementById('className').value.trim();
        const gender = document.getElementById('gender').value;

        let hasError = false;
        const showErr = (id, msg) => {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            hasError = true;
        };
        if (!studentId) showErr('studentIdError', '学号不能为空');
        if (!name) showErr('nameError', '姓名不能为空');
        if (hasError) return;

        const student = { studentId, name, className, gender };
        if (id) student.id = parseInt(id);

        const url = id ? '/student/update' : '/student/add';
        const method = id ? 'PUT' : 'POST';

        try {
            const resp = await authFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            const result = await resp.json();
            if (result.code === 200) {
                alert(id ? '更新成功' : '添加成功');
                window.location.href = '/student/list-page';
            } else { alert(result.message); }
        } catch (err) { alert('网络错误，请稍后重试'); }
    });
</script>
</body>
</html>
