<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西南财经大学 · 学生考勤系统 - 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page auth-login-page">
<div class="glass-card">
    <div class="auth-brand">
        <img class="emblem-logo emblem-logo-lg" src="/images/logo.png" alt="西南财经大学">
        <div class="school-name">西南财经大学</div>
        <div class="school-sub">Southwestern University of Finance and Economics</div>
        <div class="brand-line"></div>
        <div class="system-label">学生考勤管理系统</div>
    </div>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">学号/工号/用户名</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="请输入学号、工号或用户名" autocomplete="off">
            <span class="form-error" id="usernameError"></span>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码">
            <span class="form-error" id="passwordError"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">登录</button>
        <div class="auth-footer">
            没有账号？<a href="/register">立即注册</a>
        </div>
        <div id="globalError" class="global-error"></div>
    </form>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
