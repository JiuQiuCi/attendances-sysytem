<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-required-role="teacher">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - 西南财经大学考勤系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-wrap { max-width: 1400px; margin: 30px auto; padding: 20px; }
        .checkbox-col { width: 40px; text-align: center; }
        .action-btns { display: flex; gap: 6px; }
        .empty-row td { text-align: center; padding: 40px; color: var(--text-secondary); }

        /* Upload section */
        .upload-section {
            margin-bottom: 20px;
            padding: 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            background: var(--bg);
            display: none;
            transition: all var(--transition);
        }
        .upload-section.show { display: block; }
        .upload-zone {
            text-align: center;
            padding: 24px 20px;
            border-radius: var(--radius);
            background: var(--bg-white);
            cursor: pointer;
            transition: all var(--transition);
            border: 2px dashed var(--primary);
        }
        .upload-zone:hover, .upload-zone.dragover { background: var(--primary-light); border-color: var(--primary-hover); }
        .upload-zone input[type=file] { display: none; }
        .progress-wrap { display: none; margin-top: 12px; }
        .progress-wrap.show { display: block; }
        .progress-bar-outer { height: 8px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; }
        .progress-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #005A9E); border-radius: var(--radius-full); transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; }
        .import-result { display: none; margin-top: 14px; padding: 16px; border-radius: var(--radius); background: var(--bg-white); border: 1px solid var(--border); }
        .import-result.show { display: block; }
        .import-summary { display: flex; gap: 20px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .import-summary .suc { color: var(--success); font-weight: 700; }
        .import-summary .fail { color: var(--danger); font-weight: 700; }
        .error-table { width: 100%; font-size: 0.82rem; margin-top: 8px; }
        .error-table th { font-size: 0.75rem; padding: 6px 10px; }
        .error-table td { padding: 6px 10px; word-break: break-all; }
        .collapse-header { cursor: pointer; font-weight: 700; color: var(--danger); font-size: 0.88rem; margin-top: 8px; user-select: none; }
    </style>
</head>
<body>
<script src="/js/auth-check.js"></script>
<div class="page-wrap">
    <div class="card">
        <div class="page-header">
            <img class="emblem-logo" src="/images/logo.png" alt="西南财经大学">
            <span class="page-title">学生信息管理</span>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="keyword" class="search-input" placeholder="搜索学号或姓名...">
                <button onclick="search()" class="btn btn-primary btn-sm">搜索</button>
                <button onclick="resetSearch()" class="btn btn-secondary btn-sm">重置</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button onclick="addStudent()" class="btn btn-primary">新增学生</button>
                <button onclick="batchDelete()" class="btn btn-danger">批量删除</button>
                <button onclick="exportStudents()" class="btn btn-outline">导出Excel</button>
                <button onclick="toggleUpload()" class="btn btn-success">导入Excel</button>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-zone" id="uploadZone">
                <div style="font-size:1.5rem;margin-bottom:4px;">📁</div>
                <div><strong>点击选择文件</strong> 或拖拽 Excel 到此处</div>
                <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">
                    支持学生名单格式：学号、姓名、性别、班级<br>.xlsx / .xls，不超过 10MB
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls">
            </div>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
                <div class="progress-text" id="progressText">上传中 0%</div>
            </div>
            <div class="import-result" id="importResult">
                <div class="import-summary">
                    <span>总行数: <span id="totalRows">0</span></span>
                    <span class="suc">成功: <span id="successCount">0</span></span>
                    <span class="fail">失败: <span id="failureCount">0</span></span>
                </div>
                <div class="collapse-header" id="errorToggle" style="display:none;" onclick="toggleErrors()">查看导入失败详情</div>
                <div class="table-wrapper" id="errorTableWrap" style="display:none;margin-top:8px;">
                    <table class="error-table">
                        <thead><tr><th>行号</th><th>字段</th><th>错误信息</th></tr></thead>
                        <tbody id="errorTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="studentTable">
                <thead>
                <tr>
                    <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                    <th data-sort="studentId">学号</th>
                    <th data-sort="name">姓名</th>
                    <th data-sort="gender">性别</th>
                    <th data-sort="className">班级</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                <tr class="empty-row"><td colspan="6">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>
</div>

<script>
    let currentPage = 0, pageSize = 10, sortBy = 'id', direction = 'asc', keyword = '';

    function loadData() {
        let url = `/student/list?page=${currentPage}&size=${pageSize}&sortBy=${sortBy}&direction=${direction}`;
        if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
        authFetch(url)
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    renderTable(result.data.content);
                    renderPagination(result.data);
                } else { alert(result.message); }
            })
            .catch(err => console.error(err));
    }

    function renderTable(students) {
        const tbody = document.getElementById('tableBody');
        if (!students || students.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        students.forEach(s => {
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<input type="checkbox" class="studentCheckbox" value="${s.id}">`;
            row.insertCell(1).innerText = s.studentId;
            row.insertCell(2).innerText = s.name;
            row.insertCell(3).innerText = s.gender || '';
            row.insertCell(4).innerText = s.className || '';
            const actions = row.insertCell(5);
            actions.className = 'action-btns';
            actions.innerHTML = `
                <button class="btn btn-warning btn-sm" onclick="editStudent(${s.id})">编辑</button>
                <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">删除</button>
            `;
        });
    }

    function renderPagination(page) {
        const div = document.getElementById('pagination');
        div.innerHTML = '';
        if (!page || page.totalPages <= 1) return;
        for (let i = 0; i < page.totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i + 1;
            if (i === currentPage) btn.classList.add('active');
            btn.onclick = () => { currentPage = i; loadData(); };
            div.appendChild(btn);
        }
    }

    function search() { keyword = document.getElementById('keyword').value; currentPage = 0; loadData(); }
    function resetSearch() { document.getElementById('keyword').value = ''; keyword = ''; currentPage = 0; loadData(); }
    function addStudent() { window.location.href = '/student/form'; }
    function editStudent(id) { window.location.href = `/student/form?id=${id}`; }

    async function deleteStudent(id) {
        if (!confirm('确定要删除该学生吗？')) return;
        const resp = await authFetch(`/student/${id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (result.code === 200) { alert('删除成功'); loadData(); }
        else alert(result.message);
    }

    async function batchDelete() {
        const checkboxes = document.querySelectorAll('.studentCheckbox:checked');
        const ids = Array.from(checkboxes).map(cb => parseInt(cb.value));
        if (ids.length === 0) { alert('请至少选择一名学生'); return; }
        if (!confirm(`确定要删除 ${ids.length} 名学生吗？`)) return;
        const resp = await authFetch('/student/batch', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        });
        const result = await resp.json();
        if (result.code === 200) { alert('批量删除成功'); loadData(); }
        else alert(result.message);
    }

    document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
            const field = th.getAttribute('data-sort');
            if (sortBy === field) direction = direction === 'asc' ? 'desc' : 'asc';
            else { sortBy = field; direction = 'asc'; }
            loadData();
        });
    });

    document.getElementById('selectAll').addEventListener('change', (e) => {
        document.querySelectorAll('.studentCheckbox').forEach(cb => cb.checked = e.target.checked);
    });

    function exportStudents() {
        window.location.href = '/student/export';
    }

    // ===== File Upload =====
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadSection = document.getElementById('uploadSection');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const importResult = document.getElementById('importResult');

    function toggleUpload() {
        uploadSection.classList.toggle('show');
        resetUploadUI();
    }

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('dragover'); });
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            startUpload(e.dataTransfer.files[0]);
        }
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) startUpload(fileInput.files[0]);
    });

    function startUpload(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['xlsx','xls'].includes(ext)) { alert('不支持的文件格式: .' + ext); return; }
        if (file.size > 10*1024*1024) { alert('文件大小超过 10MB 限制'); return; }
        resetUploadUI();
        progressWrap.classList.add('show');
        const formData = new FormData();
        formData.append('file', file);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/file/upload');
        xhr.setRequestHeader('X-XSRF-TOKEN', getCsrfToken());
        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const pct = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = '上传中 ' + pct + '%';
            }
        });
        xhr.addEventListener('load', () => {
            progressText.textContent = '处理中...';
            setTimeout(() => {
                progressWrap.classList.remove('show');
                try {
                    const resp = JSON.parse(xhr.responseText);
                    showImportResult(resp);
                } catch(e) { alert('解析响应失败'); }
            }, 400);
        });
        xhr.addEventListener('error', () => { progressWrap.classList.remove('show'); alert('上传失败'); });
        xhr.send(formData);
    }

    function showImportResult(resp) {
        importResult.classList.add('show');
        if (resp.code !== 200 || !resp.data) {
            importResult.innerHTML = '<span style="color:var(--danger);">导入失败: ' + (resp.message || '未知错误') + '</span>';
            return;
        }
        const d = resp.data;
        const typeLabel = d.importType === 'student' ? '学生名单' : '考勤记录';
        document.getElementById('totalRows').textContent = d.totalRows;
        document.getElementById('successCount').textContent = d.successCount + ' (' + typeLabel + ')';
        document.getElementById('failureCount').textContent = d.failureCount;
        const errorToggle = document.getElementById('errorToggle');
        const errorBody = document.getElementById('errorTableBody');
        if (d.errors && d.errors.length > 0) {
            errorToggle.style.display = 'block';
            errorBody.innerHTML = '';
            d.errors.forEach(err => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${err.row}</td><td>${err.field||'-'}</td><td>${err.message}</td>`;
                errorBody.appendChild(tr);
            });
        } else { errorToggle.style.display = 'none'; }
        if (d.successCount > 0) loadData();
    }

    function toggleErrors() {
        const wrap = document.getElementById('errorTableWrap');
        wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
    }

    function resetUploadUI() {
        progressBar.style.width = '0%';
        progressText.textContent = '上传中 0%';
        progressWrap.classList.remove('show');
        importResult.classList.remove('show');
        fileInput.value = '';
    }

    loadData();
</script>
</body>
</html>
