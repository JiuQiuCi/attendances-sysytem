<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西财学生考勤系统 - 首页</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="dashboard">
    <!-- 头部 -->
    <div class="dash-header">
        <div class="dash-brand">
            <div class="dash-logo">西财</div>
            <span class="dash-school">西南财经大学 · 学生考勤系统</span>
        </div>
        <div class="dash-user">
            <span class="dash-username" id="usernameDisplay"></span>
            <button class="btn btn-danger btn-sm" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- 欢迎卡片 -->
    <div class="welcome-card">
        <h2>欢迎，<span id="welcomeName"></span>！</h2>
        <p>欢迎使用西南财经大学学生考勤管理系统。请选择您需要的功能模块。</p>
    </div>

    <!-- 功能菜单 -->
    <div class="menu-grid">
        <div class="menu-card" onclick="location.href='/student/list-page'">
            <span class="menu-icon">👨‍🎓</span>
            <div class="menu-title">学生管理</div>
            <div class="menu-desc">管理学生基本信息（增删改查、批量删除、搜索排序）</div>
        </div>
        <div class="menu-card" onclick="location.href='/attendance/list-page'">
            <span class="menu-icon">📅</span>
            <div class="menu-title">考勤管理</div>
            <div class="menu-desc">记录每日出勤，查看统计报表</div>
        </div>
        <div class="menu-card" onclick="location.href='/course/list-page'">
            <span class="menu-icon">📚</span>
            <div class="menu-title">课程管理</div>
            <div class="menu-desc">维护课程信息，分配授课教师</div>
        </div>
        <div class="menu-card" onclick="location.href='/report'">
            <span class="menu-icon">📊</span>
            <div class="menu-title">数据报表</div>
            <div class="menu-desc">出勤率分析，班级对比图表</div>
        </div>
    </div>

    <div class="dash-footer">
        © 2026 西南财经大学 | 考勤管理系统
    </div>
</div>

<script>
    const user = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!user.username) {
        window.location.href = '/login';
    } else {
        const displayName = user.name || user.username;
        document.getElementById('usernameDisplay').innerText = displayName;
        document.getElementById('welcomeName').innerText = displayName;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '/login';
    }
</script>
</body>
</html>
